<style>
:root{--bg:#f8f5ef;--card:#fffdf9;--ink:#34352d;--muted:#817f74;--green:#536e59;--pale:#e7eee4;--line:#e7e3da;--rose:#e9c7b9;--shadow:0 9px 30px #34352d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.shell{max-width:1120px;margin:auto;padding:30px 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:12px;font-family:Fraunces,serif;font-size:25px;font-weight:600}.brand-icon{background:var(--green);border-radius:15px;color:white;width:43px;height:43px;display:grid;place-items:center;font-size:28px}.nav{display:flex;gap:5px;padding:5px;background:#eeeae2;border-radius:16px}.nav button{border:0;padding:11px 19px;border-radius:12px;background:transparent;color:#716f65;font-weight:700}.nav button.active{background:var(--card);color:var(--green);box-shadow:0 2px 8px #0000000a}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:25px 0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--green)}h1,h2,h3{font-family:Fraunces,serif;font-weight:500}h1{font-size:clamp(34px,5vw,51px);line-height:1.12;margin:10px 0}h2{font-size:29px;margin:0 0 8px}h3{font-size:21px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.65}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:700}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:#a34f42}.btn.small{font-size:12px;padding:8px 11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{border:1px solid var(--line);background:var(--card);border-radius:20px;box-shadow:var(--shadow)}.project-card{padding:22px;display:flex;flex-direction:column;min-height:205px}.project-card h3{margin:10px 0 5px}.project-card .grow{flex:1}.pill{display:inline-flex;border-radius:50px;padding:6px 10px;background:var(--pale);color:var(--green);font-size:11px;font-weight:700}.progress{height:8px;background:#e8e6df;border-radius:20px;overflow:hidden}.progress>span{height:100%;background:var(--green);display:block;transition:width .2s}.panel{padding:24px}.empty{text-align:center;padding:65px 20px}.empty-art{font-size:54px;margin-bottom:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.steps{display:flex;flex-direction:column;gap:10px;margin-top:22px}.step{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.step.done{background:#f4f7f0;border-color:#d6e0d2}.step-main{display:flex;align-items:flex-start;gap:12px;padding:15px}.check{height:25px;width:25px;border:1.5px solid #c0c5b7;border-radius:8px;background:white;flex:none;display:grid;place-items:center;color:white;font-size:17px}.step.done .check{background:var(--green);border-color:var(--green)}.step-text{flex:1;min-width:0}.step-text strong{font-size:13px;color:var(--green)}.step-text p{margin:5px 0 0;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.step.done .step-text p{text-decoration:line-through;color:#989a91}.step-actions{display:flex;gap:4px}.icon-btn{background:transparent;border:0;color:#89877d;border-radius:8px;padding:6px}.repeat-head{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f7f5ef;padding:10px 15px;font-size:12px;color:#6e736a}.repeat-head button{border:0;background:transparent;color:var(--green);font-weight:700}.aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}.count{text-align:center;font:500 75px/1.15 Fraunces,serif;color:var(--green);margin:20px 0}.counter-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.counter-buttons button{height:48px;min-width:0;background:var(--pale);border:0;border-radius:13px;font-size:21px;color:var(--green);font-weight:700}.statrow{display:flex;justify-content:space-between;font-size:13px;margin:16px 0 10px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0;font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:12px 13px;background:#fff;border:1px solid #dcd9d0;border-radius:11px;outline-color:var(--green);font-weight:400;color:var(--ink)}textarea{resize:vertical}.drop{border:2px dashed #c9d3c7;border-radius:17px;padding:24px;text-align:center;background:#f7faf5;cursor:pointer}.drop.hover{background:#e7eee4}.drop input{display:none}.notice{background:#fff4e8;border:1px solid #efddc3;border-radius:11px;padding:12px;color:#865b2c;font-size:12px;line-height:1.5;margin:12px 0}.muted{color:var(--muted)}.modalback{position:fixed;inset:0;background:#2228;z-index:10;display:grid;place-items:center;padding:15px}.modal{background:var(--card);border-radius:20px;width:min(650px,100%);padding:26px;max-height:92vh;overflow:auto;box-shadow:0 22px 100px #0003}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.preview{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 18px;border-radius:12px;font-size:13px;z-index:30}.divider{height:1px;background:var(--line);margin:18px 0}.mini{font-size:12px}.wrap{display:flex;flex-wrap:wrap;gap:9px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.aside{position:static;display:grid;grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:18px 14px 90px}.top{align-items:flex-start;flex-direction:column;margin-bottom:25px}.nav{width:100%}.nav button{flex:1}.hero{align-items:flex-start;flex-direction:column}.cards,.aside{grid-template-columns:1fr}.panel{padding:17px}.step-main{padding:12px}.modal{padding:18px}.count{font-size:62px}}
</style>

<body><div class="shell"><header class="top"><div class="brand"><div class="brand-icon">∞</div> Stitched Up</div><nav class="nav"><button data-tab="projects" class="active">My projects</button><button data-tab="tracker">Pattern tracker</button></nav></header><main id="app"></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const KEY='loop-by-loop-v1';let state=load(),tab='projects',modal=null,expanded={};const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.projects))return s}catch{}return{projects:[],selected:null}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Browser storage is full. Export a backup from the project tracker.')}}function project(){return state.projects.find(p=>p.id===state.selected)}function uid(){return crypto.randomUUID?.()||String(Date.now())+Math.random()}function completed(p){return p.groups.reduce((n,g)=>n+g.rows.filter(r=>r.done).length,0)}function total(p){return p.groups.reduce((n,g)=>n+g.rows.length,0)}function pct(p){return total(p)?Math.round(100*completed(p)/total(p)):0}function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=tab==='projects'?projectsView():trackerView();wire();}
function projectsView(){return `<div class="hero"><div><div class="eyebrow">Your creative corner</div><h1>Works in progress,<br>beautifully organised.</h1><div class="sub">One stitch at a time. Every row counts.</div></div><button class="btn primary" id="new">+ New crochet project</button></div>${!state.projects.length?`<div class="panel empty"><div class="empty-art">🧶</div><h2>Your next project starts here</h2><p class="sub">Paste crochet instructions, upload a PDF, or start from scratch.</p><button class="btn primary" id="newEmpty">Create your first project</button></div>`:`<div class="cards">${state.projects.map(p=>`<article class="card project-card"><div class="row"><span class="pill">${esc(p.status||'In progress')}</span><button class="icon-btn" data-delete="${p.id}" title="Delete project">⋯</button></div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.hook||'No hook size')} ${p.yarn?'· '+esc(p.yarn):''}</div><div class="grow"></div><div class="statrow"><span class="muted">${completed(p)} of ${total(p)} rows</span><strong>${pct(p)}%</strong></div><div class="progress"><span style="width:${pct(p)}%"></span></div><div class="row" style="margin-top:17px"><button class="btn primary small" data-open="${p.id}">Continue pattern →</button><button class="btn small" data-editproject="${p.id}">Details</button></div></article>`).join('')}</div>`}<div class="sub" style="margin-top:24px">Saved locally in this browser. Use the backup feature in a project to keep a portable copy.</div>`}
function trackerView(){const p=project();if(!p)return `<div class="panel empty"><h2>No project selected</h2><p class="sub">Choose a project to track its rows.</p><button id="goProjects" class="btn primary">View projects</button></div>`;return `<div class="hero"><div><div class="eyebrow">Pattern tracker / ${esc(p.status||'In progress')}</div><h1>${esc(p.name)}</h1><div class="sub">${esc(p.hook||'Hook size not set')} ${p.yarn?'· '+esc(p.yarn):''}</div></div><div class="toolbar"><button class="btn" id="editPattern">Edit pattern</button><button class="btn" id="backup">Export backup</button><button class="btn" id="importBackup">Import backup</button></div></div><div class="workspace"><section class="panel"><div class="row"><div><h2>Stitch by stitch</h2><div class="sub">Tap any row to cross it off. Repeat groups open into individual rows.</div></div><button class="btn small" id="addRow">+ Add step</button></div><div class="statrow"><span>${completed(p)} rows completed</span><b>${pct(p)}%</b></div><div class="progress"><span style="width:${pct(p)}%"></span></div><div class="steps">${p.groups.length?p.groups.map((g,i)=>groupView(g,i)).join(''):`<p class="sub">No instructions yet. Add a step or edit the pattern.</p>`}</div></section><aside class="aside"><section class="panel"><div class="eyebrow">Your row counter</div><div class="count">${p.counter||0}</div><div class="counter-buttons"><button data-counter="-10" aria-label="Decrease row counter by 10">−10</button><button data-counter="-5" aria-label="Decrease row counter by 5">−5</button><button data-counter="-1" aria-label="Decrease row counter by 1">−1</button><button data-counter="1" aria-label="Increase row counter by 1">+1</button><button data-counter="5" aria-label="Increase row counter by 5">+5</button><button data-counter="10" aria-label="Increase row counter by 10">+10</button></div><p class="sub mini" style="text-align:center">Independent counter · saved automatically</p><div class="row"><button class="btn small" id="reset">Reset</button><button class="btn small" id="sync">Set to completed rows</button></div></section><section class="panel"><div class="eyebrow">Project notes</div><textarea id="notes" rows="5" placeholder="Yarn colours, hook changes, modifications…">${esc(p.notes||'')}</textarea><div class="divider"></div><label class="field">Project status<select id="status"><option ${p.status==='In progress'?'selected':''}>In progress</option><option ${p.status==='On hold'?'selected':''}>On hold</option><option ${p.status==='Finished'?'selected':''}>Finished</option></select></label><div class="sub mini">PDFs are read in your browser; the original PDF isn't uploaded to a server.</div></section></aside></div>`}
function groupView(g,i){let n=g.rows.length;const multiple=n>1,open=expanded[g.id]!==false;return `<div class="step"><div class="repeat-head"><span><b>${esc(g.label||'Step '+(i+1))}</b> ${multiple?'· '+n+' rows':''}</span><div class="toolbar">${multiple?`<button data-expand="${g.id}">${open?'Hide rows':'Show '+n+' rows'} ${open?'⌃':'⌄'}</button>`:''}<button data-edit="${g.id}" title="Edit step">Edit</button></div></div>${(!multiple||open)?g.rows.map((r,j)=>`<div class="step-main ${r.done?'done':''}" style="${j?'border-top:1px solid var(--line)':''}"><button class="check" data-check="${g.id}:${j}" aria-label="Mark ${esc(g.label)} row ${j+1} ${r.done?'incomplete':'complete'}">${r.done?'✓':''}</button><div class="step-text" data-check="${g.id}:${j}" role="button" tabindex="0"><strong>${multiple?`Row ${j+1} of ${n}`:esc(g.label||'Instruction '+(i+1))}</strong><p style="${r.done?'text-decoration:line-through;color:#929a91':''}">${esc(g.text)}</p></div></div>`).join(''):`<div class="step-main"><div class="sub">${g.rows.filter(r=>r.done).length}/${n} rows completed · ${esc(g.text)}</div></div>`}</div>`}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});['new','newEmpty'].forEach(id=>{if($('#'+id))$('#'+id).onclick=()=>showNew()});$('#goProjects')?.addEventListener('click',()=>{tab='projects';render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.open;save();tab='tracker';render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this project and its progress? This cannot be undone.')){state.projects=state.projects.filter(p=>p.id!==b.dataset.delete);if(state.selected===b.dataset.delete)state.selected=null;save();render()}});document.querySelectorAll('[data-editproject]').forEach(b=>b.onclick=()=>showProjectDetails(b.dataset.editproject));document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{expanded[b.dataset.expand]=expanded[b.dataset.expand]===false?true:false;render()});document.querySelectorAll('[data-check]').forEach(b=>{function toggle(){const [id,j]=b.dataset.check.split(':');let r=project().groups.find(g=>g.id===id)?.rows[+j];if(r){r.done=!r.done;save();render()}}b.onclick=toggle;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}});document.querySelectorAll('[data-counter]').forEach(b=>b.addEventListener('click',()=>{const p=project();p.counter=Math.max(0,(Number(p.counter)||0)+Number(b.dataset.counter));save();render()}));$('#reset')?.addEventListener('click',()=>{if(confirm('Reset this row counter to zero? Your checked rows will stay checked.')){project().counter=0;save();render()}});$('#sync')?.addEventListener('click',()=>{project().counter=completed(project());save();render()});$('#notes')?.addEventListener('input',e=>{project().notes=e.target.value;save()});$('#status')?.addEventListener('change',e=>{project().status=e.target.value;save()});$('#addRow')?.addEventListener('click',()=>showStep(null));$('#editPattern')?.addEventListener('click',()=>showPatternEditor());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showStep(b.dataset.edit));$('#backup')?.addEventListener('click',exportBackup);$('#importBackup')?.addEventListener('click',importBackup)}
function setModal(html){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="row"><h2 style="margin:0">${html.title}</h2><button class="icon-btn" id="closeModal" aria-label="Close">✕</button></div>${html.body}</div></div>`;$('#closeModal').onclick=closeModal;$('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()})}function closeModal(){$('#modalRoot').innerHTML=''}
function showNew(){setModal({title:'Start something lovely',body:`<label class="field">Project name<input id="pname" placeholder="e.g. Sunflower blanket" autofocus></label><label class="field">Hook size (optional)<input id="phook" placeholder="e.g. 4 mm"></label><label class="field">Yarn (optional)<input id="pyarn" placeholder="e.g. 8 ply cotton"></label><div class="divider"></div><div class="eyebrow">Choose how to add your pattern</div><div class="toolbar" style="margin:12px 0"><button class="btn primary" id="choosePaste" type="button">✏️ Paste pattern text</button><button class="btn" id="choosePDF" type="button">📄 Upload PDF</button></div><section id="pasteSection"><label class="field" for="pastePattern">Paste your crochet instructions<textarea id="pastePattern" rows="11" placeholder="Row 1: 6 sc in magic ring&#10;Row 2: inc in each stitch (12)&#10;Rows 3-5: 12 sc&#10;3x rows of 24sc" spellcheck="false"></textarea></label><div class="sub mini">Put each instruction on its own line. Repeated rows (e.g. Rows 3–5: 12 sc) become individually checkable rows. You can review the results before continuing.</div></section><section id="pdfSection" class="hidden"><div class="drop" id="drop"><div style="font-size:31px">📄</div><strong>Choose a crochet pattern PDF</strong><div class="sub">Or drag one here.</div><input id="pdf" type="file" accept="application/pdf,.pdf"></div><div id="pdfinfo" class="preview">PDF text extraction works best on digital, selectable-text patterns. You can review and edit everything before saving.</div></section><div class="divider"></div><div class="row" style="flex-wrap:wrap"><button class="btn" id="manual">Create a blank project</button><button class="btn primary" id="create">Import pasted text →</button></div>`});let chosen=null,mode='paste';const file=$('#pdf'),drop=$('#drop'),submit=$('#create');function setMode(next){mode=next;$('#pasteSection').classList.toggle('hidden',mode!=='paste');$('#pdfSection').classList.toggle('hidden',mode!=='pdf');$('#choosePaste').classList.toggle('primary',mode==='paste');$('#choosePDF').classList.toggle('primary',mode==='pdf');submit.textContent=mode==='paste'?'Import pasted text →':'Import PDF & create →';submit.disabled=mode==='pdf'&&!chosen}$('#choosePaste').onclick=()=>setMode('paste');$('#choosePDF').onclick=()=>setMode('pdf');drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('hover')};drop.ondragleave=()=>drop.classList.remove('hover');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hover');choose(e.dataTransfer.files[0])};file.onchange=()=>choose(file.files[0]);function choose(f){if(!f)return;if(!(/\.pdf$/i.test(f.name)||f.type==='application/pdf'))return notify('Please choose a PDF file');chosen=f;$('#pdfinfo').textContent=f.name+' · '+Math.round(f.size/1024)+' KB';submit.disabled=false;if(!$('#pname').value)$('#pname').value=f.name.replace(/\.pdf$/i,'').replace(/[_-]/g,' ')}$('#manual').onclick=()=>makeProject([],null);submit.onclick=async()=>{if(mode==='paste'){const raw=$('#pastePattern').value.trim();if(!raw)return notify('Paste your pattern instructions first, or create a blank project.');const groups=parsePattern(raw);if(!groups.length)return notify('No rows found. Try adding Row 1: before an instruction.');makeProject(groups,[]);showPatternEditor(true);return}if(!chosen)return;submit.disabled=true;submit.textContent='Reading PDF…';try{const result=await extractPDF(chosen);const groups=parsePattern(result.text);makeProject(groups,result.warnings);if(groups.length)showPatternEditor(true);else notify('No rows identified. Paste or type instructions in the editor.')}catch(e){console.error(e);notify('Could not read the PDF. Try pasting its text or creating manually.');submit.disabled=false;submit.textContent='Import PDF & create →'}};function makeProject(groups,warnings){const p={id:uid(),name:$('#pname').value.trim()||'Untitled crochet project',hook:$('#phook').value.trim(),yarn:$('#pyarn').value.trim(),status:'In progress',counter:0,notes:'',groups,sourceWarnings:warnings||[]};state.projects.unshift(p);state.selected=p.id;save();closeModal();tab='tracker';render()}}
async function extractPDF(file){const bytes=new Uint8Array(await file.arrayBuffer());const doc=await pdfjsLib.getDocument({data:bytes}).promise;let texts=[],warnings=[];for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();let lines=[],prevY=null,line='';for(const item of content.items){const t=item.str||'',y=item.transform?.[5];if(prevY!==null&&typeof y==='number'&&Math.abs(y-prevY)>4){if(line.trim())lines.push(line.trim());line=''}line+=t+(item.hasEOL?'\n':' ');if(item.hasEOL){lines.push(line.trim());line='';prevY=null}else prevY=y}if(line.trim())lines.push(line.trim());texts.push(lines.join('\n'))}let text=texts.join('\n');if(text.trim().length<30)warnings.push('Very little selectable text was found. This may be a scanned/image PDF and will need manual transcription or OCR.');return{text,warnings}}
function parsePattern(text){const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);let groups=[],current=null;function add(label,desc,n){const count=Math.max(1,Math.min(500,Number(n)||1));groups.push({id:uid(),label:label||'Step '+(groups.length+1),text:desc.trim(),rows:Array.from({length:count},()=>({done:false}))})}for(const line of lines){let l=line.replace(/\s+/g,' ').trim();if(l.length>450)continue;let m;
// 3x rows of 24sc, 3 rows: sc in each st, repeat rows 5-8
if(m=l.match(/^(?:(\d+)\s*[x×]\s*)?rows?\s*(\d+)\s*[-–]\s*(\d+)\s*[:.)-]\s*(.+)$/i)){const a=+m[2],b=+m[3];add(`Rows ${a}–${b}`,m[4],b>=a&&b-a<=499?b-a+1:1);continue}
if(m=l.match(/^(?:repeat\s+)?rows?\s*(\d+)\s*[-–]\s*(\d+)\s*[:.)-]?\s*(.*)$/i)){const a=+m[1],b=+m[2];add(`Rows ${a}–${b}`,m[3]||'Repeat previous row instructions',b>=a&&b-a<=499?b-a+1:1);continue}
if(m=l.match(/^(?:rows?\s*)?(\d+)\s*[x×]\s*rows?\s*(?:of\s*)?[:\-]?\s*(.+)$/i)){add(`${m[1]} rows`,m[2],+m[1]);continue}
if(m=l.match(/^(\d+)\s*[x×]\s*rows?\s*(?:of\s*)?(.+)$/i)){add(`${m[1]} rows`,m[2],+m[1]);continue}
if(m=l.match(/^(?:rows?|rounds?|rnds?|rnd|r)\s*\.?\s*(\d+)\s*[:.)\-–]\s*(.+)$/i)){add(`Row ${m[1]}`,m[2],1);continue}
if(m=l.match(/^(?:rows?|rounds?|rnds?|rnd|r)\s+(\d+)\s+(.+)$/i)){add(`Row ${m[1]}`,m[2],1);continue}
if(m=l.match(/^(\d+)\s*[x×]\s*(?:rows?\s*)?(?:of\s*)?(\d+\s*(?:sc|dc|hdc|tr|sts?|stitches)\b.*)$/i)){add(`${m[1]} rows`,m[2],+m[1]);continue}
if(m=l.match(/^\d+\s*[.)]\s*(.+)$/)){add(`Step ${groups.length+1}`,m[1],1);continue}
// Continued instruction lines attach to immediately preceding parsed row (unless a heading).
if(groups.length&&l.length>4&&!/^(materials|supplies|abbreviations|gauge|size|copyright|pattern notes|skill level|yarn|hook)\b/i.test(l)&&!/^https?:/i.test(l)&&l.length<150){const g=groups[groups.length-1];if(!/[.!)]$/.test(g.text))g.text+=' '+l}
}return groups}
function showPatternEditor(imported=false){const p=project();setModal({title:imported?'Review imported pattern':'Edit pattern instructions',body:`${p.sourceWarnings?.length?`<div class="notice">${p.sourceWarnings.map(esc).join(' ')}</div>`:''}<p class="sub">One instruction per line. Examples: <b>Row 1: 6 sc in magic ring</b>, <b>Rows 2-4: 24 sc</b>, or <b>3x rows of 24sc</b>. Imported patterns can be imperfect — review the rows before tracking.</p><label class="field">Instructions<textarea id="rawPattern" rows="14" spellcheck="false">${esc(p.groups.map(g=>g.rows.length>1?`${g.rows.length}x rows of ${g.text}`:`${g.label}: ${g.text}`).join('\n'))}</textarea></label><div class="notice">Re-parsing replaces the current instruction list and resets all crossed-off rows. Your separate row counter and project notes are kept.</div><div class="row"><button id="cancelEditor" class="btn">Keep existing rows</button><button id="reparse" class="btn primary">Save instructions</button></div>`});$('#cancelEditor').onclick=closeModal;$('#reparse').onclick=()=>{const raw=$('#rawPattern').value;const groups=parsePattern(raw);if(p.groups.some(g=>g.rows.some(r=>r.done))&&!confirm('Replace all steps? Your completed row checkmarks will be reset.'))return;p.groups=groups;p.sourceWarnings=[];save();closeModal();render();notify(`${groups.length} instruction groups saved`)}}
function showStep(id){const p=project(),g=p.groups.find(g=>g.id===id);setModal({title:g?'Edit step':'Add a step',body:`<label class="field">Step label<input id="label" value="${esc(g?.label||'Row '+(total(p)+1))}"></label><label class="field">Instruction<textarea id="instruction" rows="4" placeholder="e.g. sc in each stitch around">${esc(g?.text||'')}</textarea></label><label class="field">Number of repeated rows<input id="repeats" type="number" min="1" max="500" value="${g?.rows.length||1}"></label><div class="row">${g?'<button class="btn danger" id="removeStep">Delete step</button>':'<span></span>'}<button class="btn primary" id="saveStep">Save step</button></div>`});$('#saveStep').onclick=()=>{const n=Math.max(1,Math.min(500,Number($('#repeats').value)||1)),label=$('#label').value.trim(),instr=$('#instruction').value.trim();if(!instr)return notify('Add an instruction first');if(g){g.label=label;g.text=instr;g.rows=Array.from({length:n},(_,i)=>g.rows[i]||{done:false})}else p.groups.push({id:uid(),label,text:instr,rows:Array.from({length:n},()=>({done:false}))});save();closeModal();render()};$('#removeStep')?.addEventListener('click',()=>{if(confirm('Delete this instruction and its progress?')){p.groups=p.groups.filter(x=>x.id!==id);save();closeModal();render()}})}
function showProjectDetails(id){const p=state.projects.find(x=>x.id===id);setModal({title:'Project details',body:`<label class="field">Project name<input id="pname" value="${esc(p.name)}"></label><label class="field">Hook size<input id="phook" value="${esc(p.hook)}"></label><label class="field">Yarn<input id="pyarn" value="${esc(p.yarn)}"></label><button class="btn primary" id="saveDetails">Save details</button>`});$('#saveDetails').onclick=()=>{p.name=$('#pname').value.trim()||p.name;p.hook=$('#phook').value;p.yarn=$('#pyarn').value;save();closeModal();render()}}
function exportBackup(){const p=project();const blob=new Blob([JSON.stringify({app:'loop-by-loop',version:1,project:p},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.name.replace(/[^\w-]+/g,'_')+'-crochet-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importBackup(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{const data=JSON.parse(await f.files[0].text());const p=data.project;if(!p||!Array.isArray(p.groups)||typeof p.name!=='string')throw Error('Invalid backup');p.id=uid();p.groups.forEach(g=>g.id=uid());state.projects.unshift(p);state.selected=p.id;save();render();notify('Project restored as a new copy')}catch{notify('This does not look like a valid backup')}};f.click()}
render();
