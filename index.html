<!doctype html>
<html lang="en">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef">
<title>Stitched Up — Crochet Pattern Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5ef;--card:#fffdf9;--ink:#34352d;--muted:#817f74;--green:#536e59;--pale:#e7eee4;--line:#e7e3da;--rose:#e9c7b9;--shadow:0 9px 30px #34352d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.shell{max-width:1120px;margin:auto;padding:30px 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:12px;font-family:Fraunces,serif;font-size:25px;font-weight:600}.brand-icon{background:var(--green);border-radius:15px;color:white;width:43px;height:43px;display:grid;place-items:center;font-size:28px}.nav{display:flex;gap:5px;padding:5px;background:#eeeae2;border-radius:16px}.nav button{border:0;padding:11px 19px;border-radius:12px;background:transparent;color:#716f65;font-weight:700}.nav button.active{background:var(--card);color:var(--green);box-shadow:0 2px 8px #0000000a}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:25px 0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--green)}h1,h2,h3{font-family:Fraunces,serif;font-weight:500}h1{font-size:clamp(34px,5vw,51px);line-height:1.12;margin:10px 0}h2{font-size:29px;margin:0 0 8px}h3{font-size:21px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.65}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:700}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:#a34f42}.btn.small{font-size:12px;padding:8px 11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{border:1px solid var(--line);background:var(--card);border-radius:20px;box-shadow:var(--shadow)}.project-card{padding:22px;display:flex;flex-direction:column;min-height:205px}.project-card h3{margin:10px 0 5px}.project-card .grow{flex:1}.pill{display:inline-flex;border-radius:50px;padding:6px 10px;background:var(--pale);color:var(--green);font-size:11px;font-weight:700}.progress{height:8px;background:#e8e6df;border-radius:20px;overflow:hidden}.progress>span{height:100%;background:var(--green);display:block;transition:width .2s}.panel{padding:24px}.empty{text-align:center;padding:65px 20px}.empty-art{font-size:54px;margin-bottom:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.steps{display:flex;flex-direction:column;gap:10px;margin-top:22px}.step{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.step.done{background:#edf0ec;border-color:#d4dbd3}.step-main.done{background:#ecefeb;color:#858d85}.step-main.done .step-text strong{color:#7a857b}.step-main.current{background:#f4faf2;box-shadow:inset 4px 0 var(--green)}.step-main{transition:background .15s ease}.step-main[data-check]{cursor:pointer}.step-main:focus-visible{outline:3px solid var(--green);outline-offset:-3px}.check{pointer-events:none}.check[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#fff}.checkmark{font-size:16px;font-weight:800}.tracker-options{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}.prior-banner{border:1px dashed #cdd6cb;background:#f0f3ed;padding:15px;border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:#59665a}.step-text p.done-description{text-decoration:line-through;color:#8c938b}.row-status{font-size:11px;font-weight:700;border-radius:30px;padding:4px 9px;background:#e9ece7;color:#718076}.step-main.current .row-status{background:#dceade;color:#3c6445}.step-main{display:flex;align-items:flex-start;gap:12px;padding:15px}.check{height:25px;width:25px;border:1.5px solid #c0c5b7;border-radius:8px;background:white;flex:none;display:grid;place-items:center;color:white;font-size:17px}.step.done .check{background:var(--green);border-color:var(--green)}.step-text{flex:1;min-width:0}.step-text strong{font-size:13px;color:var(--green)}.step-text p{margin:5px 0 0;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.step.done .step-text p{text-decoration:line-through;color:#989a91}.step-actions{display:flex;gap:4px}.icon-btn{background:transparent;border:0;color:#89877d;border-radius:8px;padding:6px}.repeat-head{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f7f5ef;padding:10px 15px;font-size:12px;color:#6e736a}.repeat-head button{border:0;background:transparent;color:var(--green);font-weight:700}.aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}.count{text-align:center;font:500 75px/1.15 Fraunces,serif;color:var(--green);margin:20px 0}.counter-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.counter-buttons button{height:48px;min-width:0;background:var(--pale);border:0;border-radius:13px;font-size:21px;color:var(--green);font-weight:700}.statrow{display:flex;justify-content:space-between;font-size:13px;margin:16px 0 10px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0;font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:12px 13px;background:#fff;border:1px solid #dcd9d0;border-radius:11px;outline-color:var(--green);font-weight:400;color:var(--ink)}textarea{resize:vertical}.drop{border:2px dashed #c9d3c7;border-radius:17px;padding:24px;text-align:center;background:#f7faf5;cursor:pointer}.drop.hover{background:#e7eee4}.drop input{display:none}.notice{background:#fff4e8;border:1px solid #efddc3;border-radius:11px;padding:12px;color:#865b2c;font-size:12px;line-height:1.5;margin:12px 0}.muted{color:var(--muted)}.modalback{position:fixed;inset:0;background:#2228;z-index:10;display:grid;place-items:center;padding:15px}.modal{background:var(--card);border-radius:20px;width:min(650px,100%);padding:26px;max-height:92vh;overflow:auto;box-shadow:0 22px 100px #0003}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.preview{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 18px;border-radius:12px;font-size:13px;z-index:30}.divider{height:1px;background:var(--line);margin:18px 0}.mini{font-size:12px}.wrap{display:flex;flex-wrap:wrap;gap:9px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.aside{position:static;display:grid;grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:18px 14px 90px}.top{align-items:flex-start;flex-direction:column;margin-bottom:25px}.nav{width:100%}.nav button{flex:1}.hero{align-items:flex-start;flex-direction:column}.cards,.aside{grid-template-columns:1fr}.panel{padding:17px}.step-main{padding:12px}.modal{padding:18px}.count{font-size:62px}}

/* Pattern Planner */
.planner-tabs{display:flex;gap:8px;flex-wrap:wrap}.planner-tabs button.active{background:var(--green);color:white;border-color:var(--green)}.planner-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}.planner-side{display:flex;flex-direction:column;gap:14px}.planner-card{border:1px solid var(--line);background:#fffdf9;border-radius:18px;padding:17px}.planner-card h3{font-size:18px;margin:0 0 10px}.planner-card .field{margin:8px 0}.planner-board-shell{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:14px;background:#ede9df;padding:18px;touch-action:pan-x pan-y}.granny-board{display:grid;gap:6px;width:max-content;min-width:100%;justify-content:start}.granny-cell{border:1px solid #ddd6cb;background:#f6f1e8;border-radius:8px;width:76px;height:76px;padding:4px;display:grid;place-items:center;cursor:pointer;position:relative}.granny-cell.chosen,.pixel.chosen{outline:3px solid var(--green);outline-offset:-2px}.granny-cell:focus-visible,.pixel:focus-visible{outline:3px solid #a06350}.granny-cell .cell-index{position:absolute;bottom:3px;right:5px;font-size:9px;color:#716b63;background:#fffc;border-radius:3px;padding:0 3px}.granny-cell svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 2px #0002)}.tile-templates{display:grid;gap:7px}.template-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:7px;background:white}.template-item.selected{border-color:var(--green);background:#f0f5ee}.template-item .btn{padding:6px 8px;font-size:11px}.template-swatch{width:49px;height:49px;flex:none}.template-name{flex:1;min-width:0;font-size:12px;font-weight:700;overflow-wrap:anywhere}.planner-empty{background:#f7f3ea;border:1px dashed #cdc4b4;padding:30px;text-align:center;border-radius:16px}.planner-actions{display:flex;flex-wrap:wrap;gap:8px}.palette-chips{display:flex;flex-wrap:wrap;gap:7px}.palette-chip{border:2px solid #d2cdc3;border-radius:12px;width:37px;height:37px;cursor:pointer;position:relative}.palette-chip.selected{outline:3px solid var(--green);outline-offset:2px}.palette-chip.selected:after{content:'✓';position:absolute;top:8px;left:12px;color:white;text-shadow:0 1px 3px #000;font-weight:bold}.palette-chip input{position:absolute;inset:0;opacity:0;cursor:pointer}.palette-add{min-width:37px;min-height:37px;padding:0 9px}.pixel-board{display:grid;gap:1px;width:max-content;touch-action:none;user-select:none}.pixel{width:23px;height:23px;border:1px solid #0000001a;cursor:crosshair;padding:0;min-width:0;touch-action:none;user-select:none}.pixel:hover{outline:2px solid var(--green);outline-offset:-2px}.planner-help{font-size:12px;color:var(--muted);line-height:1.5}.planner-badge{display:inline-block;padding:5px 9px;border-radius:9px;background:var(--pale);color:var(--green);font-size:11px;font-weight:700}.planner-color-row{display:flex;align-items:center;gap:10px;margin:7px 0}.planner-color-row input[type=color]{width:42px;height:37px;border:0;padding:0;background:transparent;cursor:pointer}.planner-color-row input[type=text]{flex:1;min-width:0}.planner-board-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:13px}.planner-board-head h2{margin:0}.planner-tool.active{background:var(--green);color:white;border-color:var(--green)}@media(max-width:850px){.planner-layout{grid-template-columns:1fr}.planner-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.planner-side{grid-template-columns:1fr}.granny-cell{width:64px;height:64px}.planner-board-shell{padding:10px}.pixel{width:19px;height:19px}.nav button{padding:10px 6px;font-size:12px}.planner-card{padding:13px}}

.pixel.no-grid{border:none!important}
.image-import-preview{width:100%;max-height:350px;object-fit:contain;image-rendering:pixelated;background:white;border:1px solid var(--line);border-radius:12px}
.image-import-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.image-import-compare img{display:block;max-width:100%;max-height:150px;margin:auto;object-fit:contain}
.image-import-pane{background:#f4f0e9;padding:10px;border-radius:12px;text-align:center}
.image-import-pane .mini{display:block;margin-bottom:7px}
.image-import-settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.image-import-settings .field{margin:0}
@media(max-width:480px){.image-import-settings{grid-template-columns:1fr 1fr}.image-import-compare{grid-template-columns:1fr 1fr}}
</style>

<body><div class="shell"><header class="top"><div class="brand"><div class="brand-icon">∞</div> Stitched Up</div><nav class="nav"><button data-tab="projects" class="active">My projects</button><button data-tab="tracker">Pattern tracker</button><button data-tab="planner">Pattern planner</button></nav></header><main id="app"></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const KEY='loop-by-loop-v1';let state=load(),tab='projects',modal=null,expanded={},showEarlier={};const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.projects)){s.plans ||= [];return s}}catch{}return{projects:[],selected:null,plans:[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Browser storage is full. Export a backup from the project tracker.')}}function project(){return state.projects.find(p=>p.id===state.selected)}function uid(){return crypto.randomUUID?.()||String(Date.now())+Math.random()}function completed(p){return p.groups.reduce((n,g)=>n+g.rows.filter(r=>r.done).length,0)}function total(p){return p.groups.reduce((n,g)=>n+g.rows.length,0)}function pct(p){return total(p)?Math.round(100*completed(p)/total(p)):0}function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=tab==='projects'?projectsView():tab==='tracker'?trackerView():plannerView();wire();}
function projectsView(){return `<div class="hero"><div><div class="eyebrow">Your creative corner</div><h1>Works in progress,<br>beautifully organised.</h1><div class="sub">One stitch at a time. Every row counts.</div></div><button class="btn primary" id="new">+ New crochet project</button></div>${!state.projects.length?`<div class="panel empty"><div class="empty-art">🧶</div><h2>Your next project starts here</h2><p class="sub">Paste crochet instructions, upload a PDF, generate numbered mosaic rows, or start from scratch.</p><button class="btn primary" id="newEmpty">Create your first project</button></div>`:`<div class="cards">${state.projects.map(p=>`<article class="card project-card"><div class="row"><span class="pill">${esc(p.status||'In progress')}</span><button class="icon-btn" data-delete="${p.id}" title="Delete project">⋯</button></div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.hook||'No hook size')} ${p.yarn?'· '+esc(p.yarn):''}</div><div class="grow"></div><div class="statrow"><span class="muted">${completed(p)} of ${total(p)} rows</span><strong>${pct(p)}%</strong></div><div class="progress"><span style="width:${pct(p)}%"></span></div><div class="row" style="margin-top:17px"><button class="btn primary small" data-open="${p.id}">Continue pattern →</button><button class="btn small" data-editproject="${p.id}">Details</button></div></article>`).join('')}</div>`}<div class="sub" style="margin-top:24px">Saved locally in this browser. Use the backup feature in a project to keep a portable copy.</div>`}
function trackerView(){const p=project();if(!p)return `<div class="panel empty"><h2>No project selected</h2><p class="sub">Choose a project to track its rows.</p><button id="goProjects" class="btn primary">View projects</button></div>`;const rows=p.groups.flatMap(g=>g.rows);const firstUndone=rows.findIndex(r=>!r.done);const prior=firstUndone<0?rows.length:firstUndone;const collapsed=showEarlier[p.id]!==true;let cursor=0;const list=p.groups.map((g,i)=>{const skip=collapsed?Math.max(0,Math.min(g.rows.length,prior-cursor)):0;const html=groupView(g,i,skip,cursor===prior || (cursor<prior && cursor+g.rows.length>prior));cursor+=g.rows.length;return html}).join('');return `<div class="hero"><div><div class="eyebrow">Pattern tracker / ${esc(p.status||'In progress')}</div><h1>${esc(p.name)}</h1><div class="sub">${esc(p.hook||'Hook size not set')} ${p.yarn?'· '+esc(p.yarn):''}</div></div><div class="toolbar"><button class="btn" id="editPattern">Edit pattern</button><button class="btn" id="backup">Export backup</button><button class="btn" id="importBackup">Import backup</button></div></div><div class="workspace"><section class="panel"><div class="row"><div><h2>Stitch by stitch</h2><div class="sub">Tap a row anywhere to mark it complete or undo it. Completed rows are greyed out.</div></div><button class="btn small" id="addRow">+ Add step</button></div><div class="statrow"><span>${completed(p)} rows completed</span><b>${pct(p)}%</b></div><div class="progress"><span style="width:${pct(p)}%"></span></div><div class="tracker-options"><label class="sub mini" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input id="collapseEarlier" type="checkbox" ${collapsed?'checked':''} style="accent-color:var(--green);width:17px;height:17px"> Collapse completed earlier rows</label><button class="btn small" id="jumpCurrent" ${firstUndone<0?'disabled':''}>↓ Jump to current row</button></div><div class="steps">${p.groups.length?`${collapsed&&prior?`<div class="prior-banner"><span>✓ ${prior} earlier ${prior===1?'row':'rows'} completed and hidden</span><button class="btn small" id="showEarlier">Show completed rows</button></div>`:''}${list}${collapsed&&firstUndone<0?'<div class="prior-banner">🎉 Every row is complete! Unhide rows if you need to make a correction.</div>':''}`:`<p class="sub">No instructions yet. Add a step or edit the pattern.</p>`}</div></section><aside class="aside"><section class="panel"><div class="eyebrow">Your row counter</div><div class="count">${p.counter||0}</div><div class="counter-buttons"><button data-counter="-10" aria-label="Decrease row counter by 10">−10</button><button data-counter="-5" aria-label="Decrease row counter by 5">−5</button><button data-counter="-1" aria-label="Decrease row counter by 1">−1</button><button data-counter="1" aria-label="Increase row counter by 1">+1</button><button data-counter="5" aria-label="Increase row counter by 5">+5</button><button data-counter="10" aria-label="Increase row counter by 10">+10</button></div><p class="sub mini" style="text-align:center">Independent counter · saved automatically</p><div class="row"><button class="btn small" id="reset">Reset</button><button class="btn small" id="sync">Set to completed rows</button></div></section><section class="panel"><div class="eyebrow">Project notes</div><textarea id="notes" rows="5" placeholder="Yarn colours, hook changes, modifications…">${esc(p.notes||'')}</textarea><div class="divider"></div><label class="field">Project status<select id="status"><option ${p.status==='In progress'?'selected':''}>In progress</option><option ${p.status==='On hold'?'selected':''}>On hold</option><option ${p.status==='Finished'?'selected':''}>Finished</option></select></label><div class="sub mini">PDFs are read in your browser; the original PDF isn't uploaded to a server.</div></section></aside></div>`}
function groupView(g,i,skip=0,hasCurrent=false){const n=g.rows.length,multiple=n>1,open=expanded[g.id]!==false,visible=g.rows.map((r,j)=>({r,j})).slice(skip),allDone=g.rows.every(r=>r.done);if(!visible.length)return '';return `<div class="step ${allDone?'done':''}" ${hasCurrent?'id="currentStep"':''}><div class="repeat-head"><span><b>${esc(g.label||'Step '+(i+1))}</b> ${multiple?'· '+g.rows.filter(r=>r.done).length+'/'+n+' rows completed':''}</span><div class="toolbar">${multiple?`<button data-expand="${g.id}">${open?'Hide rows':'Show rows'} ${open?'⌃':'⌄'}</button>`:''}<button data-edit="${g.id}" title="Edit step">Edit</button></div></div>${(!multiple||open)?visible.map(({r,j},v)=>`<div class="step-main ${r.done?'done':''} ${!r.done&&hasCurrent&&j===g.rows.findIndex(row=>!row.done)?'current':''}" data-check="${g.id}:${j}" role="checkbox" tabindex="0" aria-checked="${!!r.done}" aria-label="${esc(g.label||'Step '+(i+1))}, ${multiple?'repeat '+(j+1)+', ':''}${r.done?'completed':'not completed'}" style="${j?'border-top:1px solid var(--line)':''}"><span class="check" aria-hidden="true">${r.done?'<span class="checkmark">✓</span>':''}</span><div class="step-text"><strong>${multiple?`Row ${j+1} of ${n}`:esc(g.label||'Instruction '+(i+1))}</strong><p class="${r.done?'done-description':''}">${esc(g.text)}</p></div><span class="row-status">${r.done?'✓ Done':!r.done&&hasCurrent&&j===g.rows.findIndex(row=>!row.done)?'Up next':'To do'}</span></div>`).join(''):`<div class="step-main"><div class="sub">${g.rows.filter(r=>r.done).length}/${n} rows completed · ${esc(g.text)}</div></div>`}</div>`}
function wire(){if(tab==='planner'){wirePlanner();return}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});['new','newEmpty'].forEach(id=>{if($('#'+id))$('#'+id).onclick=()=>showNew()});$('#goProjects')?.addEventListener('click',()=>{tab='projects';render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.open;save();tab='tracker';render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this project and its progress? This cannot be undone.')){state.projects=state.projects.filter(p=>p.id!==b.dataset.delete);if(state.selected===b.dataset.delete)state.selected=null;save();render()}});document.querySelectorAll('[data-editproject]').forEach(b=>b.onclick=()=>showProjectDetails(b.dataset.editproject));document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{expanded[b.dataset.expand]=expanded[b.dataset.expand]===false?true:false;render()});$('#collapseEarlier')?.addEventListener('change',e=>{showEarlier[project().id]=!e.target.checked;render()});$('#showEarlier')?.addEventListener('click',()=>{showEarlier[project().id]=true;render()});$('#jumpCurrent')?.addEventListener('click',()=>{const current=$('#currentStep');if(current){const exp=current.querySelector('[data-expand]');if(exp&&expanded[exp.dataset.expand]===false){expanded[exp.dataset.expand]=true;render()}$('#currentStep')?.scrollIntoView({behavior:'smooth',block:'center'})}else notify('Open the repeated row group to see the current row')});document.querySelectorAll('[data-check]').forEach(b=>{function toggle(){const [id,j]=b.dataset.check.split(':');const r=project().groups.find(g=>g.id===id)?.rows[+j];if(r){r.done=!r.done;save();render()}}b.onclick=toggle;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}});document.querySelectorAll('[data-counter]').forEach(b=>b.addEventListener('click',()=>{const p=project();p.counter=Math.max(0,(Number(p.count function showNew(){setModal({title:'Start something lovely',body:`<label class="field">Project name<input id="pname" placeholder="e.g. Sunflower blanket" autofocus></label><label class="field">Hook size (optional)<input id="phook" placeholder="e.g. 4 mm"></label><label class="field">Yarn (optional)<input id="pyarn" placeholder="e.g. 8 ply cotton"></label><div class="divider"></div><div class="eyebrow">Choose how to add your pattern</div><div class="toolbar" style="margin:12px 0"><button class="btn primary" id="choosePaste" type="button">✏️ Paste pattern text</button><button class="btn" id="choosePDF" type="button">📄 Upload PDF</button><button class="btn" id="chooseMosaic" type="button">🧶 Mosaic row tracker</button></div><section id="pasteSection"><label class="field" for="pastePattern">Paste your crochet instructions<textarea id="pastePattern" rows="11" placeholder="Row 1: 6 sc in magic ring&#10;Row 2: inc in each stitch (12)&#10;Rows 3-5: 12 sc&#10;3x rows of 24sc" spellcheck="false"></textarea></label><div class="sub mini">Put each instruction on its own line. Repeated rows (e.g. Rows 3–5: 12 sc) become individually checkable rows. You can review the results before continuing.</div></section><section id="mosaicSection" class="hidden"><p class="sub">Just numbered rows to tick off — no written pattern required.</p><div class="row" style="align-items:end"><label class="field" style="flex:1">First row<input id="mosaicStart" type="number" min="1" max="9999" value="1"></label><label class="field" style="flex:1">Last row<input id="mosaicEnd" type="number" min="1" max="9999" value="201"></label></div><p class="sub mini">Every row will appear separately, numbered in order, ready to cross off.</p></section><section id="pdfSection" class="hidden"><div class="drop" id="drop"><div style="font-size:31px">📄</div><strong>Choose a crochet pattern PDF</strong><div class="sub">Or drag one here.</div><input id="pdf" type="file" accept="application/pdf,.pdf"></div><div id="pdfinfo" class="preview">PDF text extraction works best on digital, selectable-text patterns. You can review and edit everything before saving.</div></section><div class="divider"></div><div class="row" style="flex-wrap:wrap"><button class="btn" id="manual">Create a blank project</button><button class="btn primary" id="create">Import pasted text →</button></div>`});let chosen=null,mode='paste';const file=$('#pdf'),drop=$('#drop'),submit=$('#create');function setMode(next){mode=next;$('#pasteSection').classList.toggle('hidden',mode!=='paste');$('#pdfSection').classList.toggle('hidden',mode!=='pdf');$('#mosaicSection').classList.toggle('hidden',mode!=='mosaic');$('#choosePaste').classList.toggle('primary',mode==='paste');$('#choosePDF').classList.toggle('primary',mode==='pdf');$('#chooseMosaic').classList.toggle('primary',mode==='mosaic');submit.textContent=mode==='paste'?'Import pasted text →':mode==='mosaic'?'Create numbered rows →':'Import PDF & create →';submit.disabled=mode==='pdf'&&!chosen}$('#choosePaste').onclick=()=>setMode('paste');$('#choosePDF').onclick=()=>setMode('pdf');$('#chooseMosaic').onclick=()=>setMode('mosaic');drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('hover')};drop.ondragleave=()=>drop.classList.remove('hover');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hover');choose(e.dataTransfer.files[0])};file.onchange=()=>choose(file.files[0]);function choose(f){if(!f)return;if(!(/\.pdf$/i.test(f.name)||f.type==='application/pdf'))return notify('Please choose a PDF file');chosen=f;$('#pdfinfo').textContent=f.name+' · '+Math.round(f.size/1024)+' KB';submit.disabled=false;if(!$('#pname').value)$('#pname').value=f.name.replace(/\.pdf$/i,'').replace(/[_-]/g,' ')}$('#manual').onclick=()=>makeProject([],null);submit.onclick=async()=>{if(mode==='mosaic'){const start=Number($('#mosaicStart').value),end=Number($('#mosaicEnd').value);if(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||end-start>9 async function extractPDF(file){const bytes=new Uint8Array(await file.arrayBuffer());const doc=await pdfjsLib.getDocument({data:bytes}).promise;let texts=[],warnings=[];for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();let lines=[],prevY=null,line='';for(const item of content.items){const t=item.str||'',y=item.transform?.[5];if(prevY!==null&&typeof y==='number'&&Math.abs(y-prevY)>4){if(line.trim())lines.push(line.trim());line=''}line+=t+(item.hasEOL?'\n':' ');if(item.hasEOL){lines.push(line.trim());line='';prevY=null}else prevY=y}if(line.trim())lines.push(line.trim());texts.push(lines.join('\n'))}let text=texts.join('\n');if(text.trim().length<30)warnings.push('Very little selectable text was found. This may be a scanned/image PDF and will need manual transcription or OCR.');return{text,warnings}}
function parsePattern(text){const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);let groups=[],current=null;function add(label,desc,n){const count=Math.max(1,Math.min(500,Number(n)||1));groups.push({id:uid(),label:label||'Step '+(groups.length+1),text:desc.trim(),rows:Array.from({length:count},()=>({done:false}))})}for(const line of lines){let l=line.replace(/\s+/g,' ').trim();if(l.length>450)continue;let m;
// 3x rows of 24sc, 3 rows: sc in each st, repeat rows 5-8
if(m=l.match(/^(?:(\d+)\s*[x×]\s*)?rows?\s*(\d+)\s*[-–]\s*(\d+)\s*[:.)-]\s*(.+)$/i)){const a=+m[2],b=+m[3];add(`Rows ${a}–${b}`,m[4],b>=a&&b-a<=499?b-a+1:1);continue}
if(m=l.match(/^(?:repeat\s+)?rows?\s*(\d+)\s*[-–]\s*(\d+)\s*[:.)-]?\s*(.*)$/i)){const a=+m[1],b=+m[2];add(`Rows ${a}–${b}`,m[3]||'Repeat previous row instructions',b>=a&&b-a<=499?b-a+1:1);continue}
if(m=l.match(/^(?:rows?\s*)?(\d+)\s*[x×]\s*rows?\s*(?:of\s*)?[:\-]?\s*(.+)$/i)){add(`${m[1]} rows`,m[2],+m[1]);continue}
if(m=l.match(/^(\d+)\s*[x×]\s*rows?\s*(?:of\s*)?(.+)$/i)){add(`${m[1]} rows`,m[2],+m[1]);continue}
if(m=l.match(/^(?:rows?|rounds?|rnds?|rnd|r)\s*\.?\s*(\d+)\s*[:.)\-–]\s*(.+)$/i)){add(`Row ${m[1]}`,m[2],1);continue}
if(m=l.match(/^(?:rows?|rounds?|rnds?|rnd|r)\s+(\d+)\s+(.+)$/i)){add(`Row ${m[1]}`,m[2],1);continue}
if(m=l.match(/^(\d+)\s*[x×]\s*(?:rows?\s*)?(?:of\s*)?(\d+\s*(?:sc|dc|hdc|tr|sts?|stitches)\b.*)$/i)){add(`${m[1]} rows`,m[2],+m[1]);continue}
if(m=l.match(/^\d+\s*[.)]\s*(.+)$/)){add(`Step ${groups.length+1}`,m[1],1);continue}
// Continued instruction lines attach to immediately preceding parsed row (unless a heading).
if(groups.length&&l.length>4&&!/^(materials|supplies|abbreviations|gauge|size|copyright|pattern notes|skill level|yarn|hook)\b/i.test(l)&&!/^https?:/i.test(l)&&l.length<150){const g=groups[groups.length-1];if(!/[.!)]$/.test(g.text))g.text+=' '+l}
}return groups}

function squareSvg(rings){const r=rings||[];let out='<svg viewBox="0 0 100 100" aria-hidden="true">';const sizes=[96,74,52,30,14];for(let i=0;i<Math.min(r.length,5);i++){const size=sizes[i],xy=(100-size)/2;out+=`<rect x="${xy}" y="${xy}" width="${size}" height="${size}" rx="${i?11:5}" fill="${esc(r[i])}" stroke="#ffffff9e" stroke-width="2"/>`;if(i<4)for(let k=0;k<4;k++){const cx=k%2===0?xy+4:xy+size-4,cy=k<2?xy+4:xy+size-4;out+=`<circle cx="${cx}" cy="${cy}" r="2.8" fill="#ffffff88"/>`}}return out+'</svg>'}

ctions"><button class="btn small planner-tool ${plannerTool==='paint'?'active':''}" data-tool="paint">✎ Pencil</button><button class="btn small planner-tool ${plannerTool==='rect'?'active':''}" data-tool="rect">▭ Rectangle</button><button class="btn small planner-tool ${plannerTool==='erase'?'active':''}" data-tool="erase">⌫ Eraser</button><button class="btn small planner-tool ${plannerTool==='fill'?'active':''}" data-tool="fill">◧ Fill region</button><button class="btn small planner-tool ${plannerTool==='swap'?'active':''}" data-tool="swap">⇄ Move / swap</button></div><p class="planner-help">${plannerTool==='rect'?'Rectangle: tap two opposite corners to create a coloured block.':plannerTool==='swap'?'Move / swap: tap a square, then the one you want to swap it with.':plannerTool==='fill'?'Fill: tap a connected colour area to recolour it.':'Pencil: draw cells. Eraser: turn cells white.'}</p><div class="planner-actions"><button class="btn small" id="undoChart">Undo</button><button class="btn small danger" id="clearChart">Clear chart</button></div></section></div><section class="planner-card"><div class="planner-board-head"><div><h2>${esc(p.name)}</h2><div class="sub">Design squares, rectangles and colourwork patterns stitch by stitch.</div></div><span class="planner-badge">${p.width} × ${p.height}</span></div><div class="planner-board-shell"><div id="pixelBoard" class="pixel-board" style="grid-template-columns:repeat(${p.width},23px)" role="grid" aria-label="Colourwork chart">${p.cells.map((c,i)=>`<button type="button" class="pixel ${p.showGrid===false?'no-grid':''} ${selectedPixel===i||rectAnchor===i?'chosen':''}" data-pixel="${i}" style="background:${esc(c||'#ffffff')}" aria-label="Stitch ${i%p.width+1}, row ${Math.floor(i/p.width)+1}, ${esc(c||'#ffffff')}"></button>`).join('')}</div></div><p class="planner-help">Row 1 is shown at the top of the chart. This is a visual colour planner, not an automatic mosaic crochet instruction generator.</p></section></div>`}
let undoHistory=[];
function snapshotChart(p){undoHistory.push(p.cells.slice());if(undoHistory.length>15)undoHistory.shift()}
function plannerRefresh(){save();render()}
function plannerNew(type){const p=makePlan(type);state.plans.push(p);selectedPlan=p.id;selectedTemplate=p.templates?.[0]?.id||null;selectedCell=null;selectedPixel=null;plannerTool='paint';undoHistory=[];plannerRefresh()}
function applySquare(idx){const p=plan();if(!p||idx<0||idx>=p.cells.length)return;if(plannerTool==='swap'){if(selectedCell===null){selectedCell=idx;render();return}const a=p.cells[selectedCell];p.cells[selectedCell]=p.cells[idx];p.cells[idx]=a;selectedCell=null}else if(plannerTool==='erase'){p.cells[idx]=null}else{p.cells[idx]=selectedTemplate}plannerRefresh()}
function applyPixel(idx,refresh=true){const p=plan();if(!p||idx<0||idx>=p.cells.length)return;const color=plannerTool==='erase'?'#ffffff':chosenColour;if(plannerTool==='swap'){if(selectedPixel===null){selectedPixel=idx;render();return}const a=p.cells[selectedPixel];p.cells[selectedPixel]=p.cells[idx];p.cells[idx]=a;selectedPixel=null;plannerRefresh();return}if(plannerTool==='rect'){if(rectAnchor===null){rectAnchor=idx;render();return}const x1=rectAnchor%p.width,y1=Math.floor(rectAnchor/p.width),x2=idx%p.width,y2=Math.floor(idx/p.width);snapshotChart(p);for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)p.cells[y*p.width+x]=chosenColour;rectAnchor=null;plannerRefresh();return}if(plannerTool==='fill'){snapshotChart(p);const old=p.cells[idx],stack=[idx],seen=new Set();while(stack.length){const i=stack.pop();if(seen.has(i)||p.cells[i]!==old)continue;seen.add(i);p.cells[i]=color;const x=i%p.width,y=Math.floor(i/p.width);if(x>0)stack.push(i-1);if(x<p.width-1)stack.push(i+1);if(y>0)stack.push(i-p.width);if(y<p.height-1)stack.push(i+p.width)}plannerRefresh();return}p.cells[idx]=color;save();if(refresh)render();else{const el=document.querySelector(`[data-pixel="${idx}"]`);if(el){el.style.background=color;el.setAttribute('aria-label',`Stitch ${idx%p.width+1}, row ${Math.floor(idx/p.width)+1}, ${color}`)}}}
function resizePlanner(){const p=plan();const w=Number($('#planWidth').value),h=Number($('#planHeight').value),lim=p.type==='granny'?30:150;if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>lim||h>lim)return notify(`Enter dimensions from 1 to ${lim}.`);if(w*h>12000)return notify('Please choose a smaller chart (12,000 cells maximum).');const prev=p.cells;const next=Array(w*h).fill(p.type==='granny'?null:'#ffffff');for(let y=0;y<Math.min(p.height,h);y++)for(let x=0;x<Math.min(p.width,w);x++)next[y*w+x]=prev[y*p.width+x];p.width=w;p.height=h;p.cells=next;selectedCell=null;rectAnchor=null;undoHistory=[];plannerRefresh()}
function editTemplate(id){const p=plan(),t=p.templates.find(x=>x.id===id);if(!t)return;setModal({title:'Design your granny square',body:`<label class="field">Square design name<input id="tileName" value="${esc(t.name)}" maxlength="70"></label><p class="sub mini">Pick up to five colours from the outer edge to the centre. The preview updates after you save.</p><div id="tileColourFields">${t.rings.map((c,i)=>`<div class="planner-color-row"><label class="mini" style="width:85px">${i===0?'Outer edge':i===t.rings.length-1?'Centre':`Round ${i+1}`}</label><input type="color" value="${esc(c)}" class="tileRing"></div>`).join('')}</div><div class="planner-actions"><button id="addRing" class="btn small">+ Add colour round</button><button id="removeRing" class="btn small">− Remove round</button></div><div class="divider"></div><button class="btn primary" id="saveTile">Save square design</button>`});$('#addRing').onclick=()=>{if(document.querySelectorAll('.tileRing').length>=5)return notify('Five rounds maximum.');const d=document.createElement('div');d.className='planner-color-row';d.innerHTML='<label class="mini" style="width:85px">New round</label><input type="color" value="#f2d4a6" class="tileRing">';$('#tileColourFields').appendChild(d)};$('#removeRing').onclick=()=>{const all=document.querySelectorAll('.tileRing');if(all.length>1)all[all.length-1].parentElement.remove()};$('#saveTile').onclick=()=>{t.name=$('#tileName').value.trim()||'Untitled square';t.rings=[...document.querySelectorAll('.tileRing')].map(e=>e.value);closeModal();plannerRefresh()}}
function exportPlannerPng(){const p=plan();if(!p)return;const unit=p.type==='granny'?80:14,margin=32,w=p.width*unit+margin*2,h=p.height*unit+margin*2;if(w*h>64000000)return notify('This chart is too large to export as a PNG. Resize it first.');const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,w,h);for(let i=0;i<p.cells.length;i++){const x=margin+(i%p.width)*unit,y=margin+Math.floor(i/p.width)*unit;if(p.type==='granny'){ctx.fillStyle='#f3eee6';ctx.fillRect(x,y,unit-2,unit-2);const tile=p.templates.find(t=>t.id===p.cells[i]);if(tile){const sizes=[unit-10,unit*.74,unit*.53,unit*.31,unit*.15];tile.rings.slice(0,5).forEach((c,j)=>{const z=sizes[j];ctx.fillStyle=c;ctx.fillRect(x+(unit-z)/2,y+(unit-z)/2,z,z)})}}else{ctx.fillStyle=p.cells[i]||'#ffffff';ctx.fillRect(x,y,unit,unit);if(p.showGrid!==false){ctx.strokeStyle='#0000001a';ctx.strokeRect(x+.5,y+.5,unit,unit)}}}canvas.toBlob(blob=>{if(!blob)return notify('Could not export the image');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(p.name||'stitched-up-plan').replace(/[^\w-]+/g,'_')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')}

// Image importer. All processing is performed locally in the browser.
let chartImageSource=null,chartImagePreview=null;
function clampNumber(value,min,max,fallback){const n=Number(value);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):fallback}
function rgbHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('')}
function imageToChart(img,w,h,colours,removeGrid,simplify=0){
 // Shrink to the intended stitch grid first; sample only cell interiors when input already has lines.
 const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});
 ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
 const cells=[];
 if(removeGrid){
   const original=document.createElement('canvas');original.width=img.naturalWidth;original.height=img.naturalHeight;
   const g=original.getContext('2d',{willReadFrequently:true});g.fillStyle='#ffffff';g.fillRect(0,0,original.width,original.height);g.drawImage(img,0,0);
   const d=g.getImageData(0,0,original.width,original.height).data;
   // Ignore grid borders by taking a robust median of several samples around each stitch centre.
   const sample=(x,y)=>{const ix=Math.min(original.width-1,Math.max(0,Math.floor(x))),iy=Math.min(original.height-1,Math.max(0,Math.floor(y))),k=(iy*original.width+ix)*4,a=d[k+3]/255;return [d[k]*a+255*(1-a),d[k+1]*a+255*(1-a),d[k+2]*a+255*(1-a)]};
   const mid=a=>a.sort((x,y)=>x-y)[Math.floor(a.length/2)];
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const vals=[[],[],[]];
      for(const oy of [-.16,0,.16])for(const ox of [-.16,0,.16]){
        const v=sample((x+.5+ox)*original.width/w,(y+.5+oy)*original.height/h);
        for(let k=0;k<3;k++)vals[k].push(v[k]);
      }
      cells.push([mid(vals[0]),mid(vals[1]),mid(vals[2])]);
   }
 }else{
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);
   const data=ctx.getImageData(0,0,w,h).data;
   for(let i=0;i<w*h;i++){const a=data[i*4+3]/255;cells.push([data[i*4]*a+255*(1-a),data[i*4+1]*a+255*(1-a),data[i*4+2]*a+255*(1-a)])}
 }
 // Deterministic adaptive colour quantization via k-means (reduced yarn palette).
 const unique=new Map();cells.forEach(v=>{const k=v.map(x=>Math.round(x/16)).join(',');if(!unique.has(k))unique.set(k,v)});
 const candidates=[...unique.values()];const k=Math.min(colours,candidates.length);
 let centres=[];
 if(k){centres.push(candidates[0]);for(let z=1;z<k;z++){
   let best=candidates[0],score=-1;
   for(const p of candidates){const dist=Math.min(...centres.map(c=>colourDist(p,c)));if(dist>score){score=dist;best=p}}
   centres.push([...best]);
 }
 for(let iter=0;iter<7;iter++){
   const acc=centres.map(()=>[0,0,0,0]);for(const v of cells){const j=closestColour(v,centres);for(let i=0;i<3;i++)acc[j][i]+=v[i];acc[j][3]++}
   centres=centres.map((c,j)=>acc[j][3]?acc[j].slice(0,3).map(v=>v/acc[j][3]):c);
 }}
 const palette=centres.map(c=>rgbHex(...c));
 let pixels=cells.map(c=>palette[closestColour(c,centres)]||'#ffffff');
 // Remove tiny colour flecks after reducing the palette. Edges are left alone unless
 // most neighbouring stitches agree on a replacement colour.
 for(let pass=0;pass<simplify;pass++){
   const before=pixels,after=before.slice();
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
     const i=y*w+x, frequencies=new Map();
     for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
       if(dx===0&&dy===0)continue;
       const nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;
       const colour=before[ny*w+nx];frequencies.set(colour,(frequencies.get(colour)||0)+1);
     }
     let best=before[i],votes=0;
     for(const [colour,n] of frequencies){if(n>votes){best=colour;votes=n}}
     // Gentle: six neighbours; stronger simplification: four or five.
     const threshold=simplify>=4?4:simplify>=2?5:6;
     if(best!==before[i]&&votes>=threshold)after[i]=best;
   }
   pixels=after;
 }
 return {pixels,palette:[...new Set(pixels)],width:w,height:h};
}
function colourDist(a,b){return (a[0]-b[0])**2*2+(a[1]-b[1])**2*3+(a[2]-b[2])**2}
function closestColour(v,centres){let chosen=0,score=Infinity;for(let i=0;i<centres.length;i++){const d=colourDist(v,centres[i]);if(d<score){score=d;chosen=i}}return chosen}
function drawImageChartPreview(result,showGrid){const {width:w,height:h,pixels}=result;const zoom=Math.max(2,Math.min(16,Math.floor(350/Math.max(w,h))));const c=document.createElement('canvas');c.width=w*zoom;c.height=h*zoom;const ctx=c.getContext('2d');pixels.forEach((v,i)=>{const x=(i%w)*zoom,y=Math.floor(i/w)*zoom;ctx.fillStyle=v;ctx.fillRect(x,y,zoom,zoom);if(showGrid&&zoom>=4){ctx.strokeStyle='#00000029';ctx.strokeRect(x+.5,y+.5,zoom,zoom)}});return c.toDataURL('image/png')}
function showChartImageImporter(){const p=plan();if(!p||p.type!=='chart')return;chartImageSource=null;chartImagePreview=null;
 setModal({title:'Turn an image into a crochet chart',body:`<p class="sub">Choose a photo, illustration or an existing gridded crochet chart. Everything is processed on your device; the image itself isn't uploaded anywhere.</p><label class="field">Image file (PNG, JPG or WebP)<input type="file" id="imageChartFile" accept="image/png,image/jpeg,image/webp,image/gif"></label><div class="image-import-settings"><label class="field">Stitches across<input id="imageChartWidth" type="number" min="1" max="150" value="${p.width}"></label><label class="field">Rows down<input id="imageChartHeight" type="number" min="1" max="150" value="${p.height}"></label></div><label class="field">Pixel-art colour detail: <strong id="imageChartPaletteLabel">8 colours</strong><input type="range" min="2" max="24" step="1" value="8" id="imageChartPalette" style="width:100%"></label><div class="planner-card" style="margin:12px 0;padding:12px"><h3 style="margin:0 0 6px">Simplify for crochet</h3><p class="planner-help">Remove tiny specks and distracting details so the chart is easier to stitch. Try the automatic suggestion, then adjust the settings and compare the previews.</p><button type="button" class="btn" id="imageAutoSimplify">✨ Make it crochet-friendly</button><label class="field" style="margin-top:12px">Simplify small details: <strong id="imageSimplifyLabel">Off</strong><input type="range" id="imageSimplify" min="0" max="4" step="1" value="0" style="width:100%"></label><div class="row" style="justify-content:space-between"><span class="mini">Preserve detail</span><span class="mini">Cleaner blocks</span></div><label class="planner-color-row"><input type="checkbox" id="imageLockRatio"><span>Keep original image proportions when resizing</span></label></div><label class="planner-color-row"><input type="checkbox" id="imageRemoveGrid" style="accent-color:var(--green)"><span>My image already has grid lines — sample inside the squares to remove them</span></label><p class="planner-help">For a gridded chart, enter the exact number of columns and rows. Line removal works best with straight, evenly spaced grids and may need some touch-ups.</p><div class="image-import-compare"><div class="image-import-pane"><span class="mini">Original image</span><img id="imageOriginal" alt="Original uploaded image preview"><span id="imageOriginalHint" class="mini">Select a file</span></div><div class="image-import-pane"><span class="mini">Crochet chart preview</span><img id="imageProcessed" alt="Pixel-art preview"><span id="imageProcessedHint" class="mini">Choose an image to preview</span></div></div><p id="imageImportStatus" class="sub mini" role="status"></p><div class="row"><button class="btn" id="cancelImageImport">Cancel</button><button class="btn primary" id="applyImageChart" disabled>Use this chart</button></div>`});
 $('#cancelImageImport').onclick=closeModal;
 const update=()=>{const img=chartImageSource;if(!img)return;const w=clampNumber($('#imageChartWidth').value,1,150,p.width),h=clampNumber($('#imageChartHeight').value,1,150,p.height),colours=clampNumber($('#imageChartPalette').value,2,24,8),simplify=clampNumber($('#imageSimplify').value,0,4,0);$('#imageChartPaletteLabel').textContent=colours+' colours';$('#imageSimplifyLabel').textContent=['Off','Light','Medium','Strong','Very strong'][simplify];if(w*h>12000){$('#imageImportStatus').textContent='Please use at most 12,000 stitches.';$('#applyImageChart').disabled=true;return}try{const output=imageToChart(img,w,h,colours,$('#imageRemoveGrid').checked,simplify);chartImagePreview=output;$('#imageProcessed').src=drawImageChartPreview(output,false);$('#imageProcessedHint').textContent=w+' × '+h+' stitches · '+output.palette.length+' colours';$('#imageImportStatus').textContent=simplify?'Preview ready. Small details have been simplified. Adjust the slider to compare.':'Preview ready. Adjust dimensions, colour count and simplification to compare.';$('#applyImageChart').disabled=false}catch(e){chartImagePreview=null;$('#imageImportStatus').textContent='Could not process this image. Try a smaller image.';$('#applyImageChart').disabled=true}};
 let request=0;const debounced=()=>{clearTimeout(request);request=setTimeout(update,100)};

 };
 $('#imageChartFile').onchange=e=>{const file=e.target.files?.[0];chartImageSource=null;chartImagePreview=null;$('#applyImageChart').disabled=true;if(!file)return;if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){notify('Choose a PNG, JPG, WebP or GIF image');return}if(file.size>15*1024*1024){notify('Image must be smaller than 15 MB');return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);if(img.naturalWidth*img.naturalHeight>16000000){$('#imageImportStatus').textContent='Image is too large. Try a smaller version.';return}chartImageSource=img;$('#imageOriginal').src=img.src;$('#imageOriginalHint').textContent=`${img.naturalWidth} × ${img.naturalHeight} pixels`;update()};img.onerror=()=>{URL.revokeObjectURL(url);$('#imageImportStatus').textContent='Unable to read that image.'};img.src=url};
 $('#applyImageChart').onclick=()=>{if(!chartImagePreview)return;if(p.cells.some(c=>c!=='#ffffff')&&!confirm('Replace the current stitch chart with this image? You can undo the replacement.'))return;snapshotChart(p);p.width=chartImagePreview.width;p.height=chartImagePreview.height;p.cells=[...chartImagePreview.pixels];p.palette=[...new Set([...chartImagePreview.palette,...(p.palette||[])])].slice(0,50);chosenColour=p.palette[0];rectAnchor=null;selectedPixel=null;closeModal();plannerRefresh();notify('Image turned into an editable crochet chart!')};
}

function wirePlanner(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#newGranny').onclick=()=>plannerNew('granny');$('#newChart').onclick=()=>plannerNew('chart');const p=plan();if(!p)return;$('#planSelect').onchange=e=>{selectedPlan=e.target.value;selectedTemplate=null;selectedCell=null;undoHistory=[];render()};$('#renamePlan').onclick=()=>{const s=prompt('Name this design:',p.name);if(s?.trim()){p.name=s.trim();plannerRefresh()}};$('#duplicatePlan').onclick=()=>{const clone=JSON.parse(JSON.stringify(p));clone.id=uid();clone.name+=' (copy)';if(clone.type==='granny'){const map={};clone.templates.forEach(t=>{const old=t.id;t.id=uid();map[old]=t.id});clone.cells=clone.cells.map(id=>map[id]||null)}state.plans.push(clone);selectedPlan=clone.id;plannerRefresh()};$('#deletePlan').onclick=()=>{if(confirm(`Delete "${p.name}"? This can't be undone.`)){state.plans=state.plans.filter(x=>x.id!==p.id);selectedPlan=null;plannerRefresh()}};$('#exportPlan').onclick=exportPlannerPng;$('#resizePlan').onclick=resizePlanner;
if(p.type==='granny'){$('#addTemplate').onclick=()=>{const t=makeTile();p.templates.push(t);selectedTemplate=t.id;save();editTemplate(t.id)};document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{selectedTemplate=b.dataset.template;plannerTool='paint';selectedCell=null;render()});document.querySelectorAll('[data-edit-template]').forEach(b=>b.onclick=()=>editTemplate(b.dataset.editTemplate));document.querySelectorAll('[data-duplicate-template]').forEach(b=>b.onclick=()=>{const t=p.templates.find(x=>x.id===b.dataset.duplicateTemplate);const c={...t,id:uid(),name:t.name+' copy',rings:[...t.rings]};p.templates.push(c);selectedTemplate=c.id;plannerRefresh()});document.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteTemplate;if(!confirm('Delete this square design and clear its placements?'))return;p.templates=p.templates.filter(t=>t.id!==id);p.cells=p.cells.map(v=>v===id?null:v);selectedTemplate=p.templates[0]?.id||null;plannerRefresh()});$('#swapMode').onclick=()=>{plannerTool='swap';selectedCell=null;render()};$('#eraseMode').onclick=()=>{plannerTool='erase';selectedCell=null;render()};$('#paintMode').onclick=()=>{plannerTool='paint';selectedCell=null;render()};$('#clearGranny').onclick=()=>{if(confirm('Clear all placed squares in this layout?')){p.cells.fill(null);plannerRefresh()}};let dragFrom=null;document.querySelectorAll('[data-granny]').forEach(el=>{const idx=Number(el.dataset.granny);el.onclick=()=>{if(Date.now()-lastDrop<350)return;applySquare(idx)};el.ondragstart=e=>{dragFrom=idx;e.dataTransfer.setData('text/plain',String(idx));e.dataTransfer.effectAllowed='move'};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const src=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(src)||src<0||src>=p.cells.length)return;const a=p.cells[src];p.cells[src]=p.cells[idx];p.cells[idx]=a;lastDrop=Date.now();plannerRefresh()}})}else{$('#importChartImage').onclick=showChartImageImporter;$('#chartGridToggle').onchange=e=>{p.showGrid=e.target.checked;plannerRefresh()};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{chosenColour=p.palette[Number(b.dataset.color)];render()});$('#customColor').oninput=e=>{chosenColour=e.target.value;if(!p.palette.includes(chosenColour))p.palette.push(chosenColour);save();render()};$('#addColor').onclick=()=>{$('#customColor').click()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{plannerTool=b.dataset.tool;rectAnchor=null;selectedPixel=null;render()});$('#undoChart').onclick=()=>{const prev=undoHistory.pop();if(prev){p.cells=prev;plannerRefresh()}else notify('Nothing to undo yet')};$('#clearChart').onclick=()=>{if(confirm('Clear all chart colours?')){snapshotChart(p);p.cells.fill('#ffffff');plannerRefresh()}};const board=$('#pixelBoard');board.onpointerdown=e=>{const cell=e.target.closest('[data-pixel]');if(!cell)return;e.preventDefault();const idx=Number(cell.dataset.pixel);drawing=plannerTool==='paint'||plannerTool==='erase';if(drawing)snapshotChart(p);applyPixel(idx,!drawing);if(drawing)try{board.setPointerCapture(e.pointerId)}catch{}};board.onpointermove=e=>{if(!drawing)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-pixel]');if(target&&board.contains(target))applyPixel(Number(target.dataset.pixel),false)};board.onpointerup=board.onpointercancel=()=>{if(drawing){drawing=false;save()}}}}
let lastDrop=0;

render();
